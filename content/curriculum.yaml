# Mapa del curso. Cada módulo declara sus prerrequisitos (deben ir antes en la numeración).
# Las lecciones viven en content/lessons/<módulo>/ y referencian el id del módulo.

stages:
  - id: s01
    number: 1
    title: Fundamentos de programación
    summary: Qué es programar, cómo pensar un problema antes de escribir código y cómo es el entorno donde vas a trabajar.
    outcome: describes cómo se convierte un programa en algo que ejecuta la computadora y resuelves problemas simples con pseudocódigo.
  - id: s02
    number: 2
    title: Swift esencial
    summary: Valores, tipos, decisiones, repetición, funciones, colecciones y optionals. La base sobre la que se apoya todo lo demás.
    outcome: escribes programas de consola correctos en Swift y lees los errores del compilador sin miedo.
  - id: s03
    number: 3
    title: Swift intermedio y avanzado
    summary: Modelar datos con struct, class y enum; protocolos, generics, closures, errores y la memoria con ARC.
    outcome: eliges el tipo adecuado para cada modelo, diseñas APIs con protocolos y genéricos y evitas ciclos de retención.
  - id: s04
    number: 4
    title: Herramientas e ingeniería de software
    summary: Swift Package Manager, Git, revisión de código y principios de diseño aplicados a Swift.
    outcome: trabajas en un repositorio con ramas y pull requests, organizas código en módulos y justificas decisiones de diseño.
  - id: s05
    number: 5
    title: Algoritmos y estructuras de datos
    summary: Complejidad y los patrones que más aparecen en entrevistas, implementados y probados en Swift.
    outcome: reconoces el patrón de un problema a partir del enunciado, lo resuelves en Swift y defiendes su complejidad.
  - id: s06
    number: 6
    title: Fundamentos del desarrollo iOS
    summary: Cómo vive una app en iOS antes de dibujar la primera pantalla. Qué pertenece al lenguaje y qué al sistema.
    outcome: explicas el ciclo de vida de una app y de sus escenas, y configuras firma, targets y entornos.
  - id: s07
    number: 7
    title: UIKit de cero a avanzado
    summary: El framework de interfaz con el que se construyó y se mantiene la mayoría de las apps en producción.
    outcome: construyes y mantienes interfaces UIKit complejas, programáticas o con Storyboards, con listas modernas y navegación.
  - id: s08
    number: 8
    title: Concurrencia y memoria
    summary: Hilos, colas y Swift Concurrency con el modelo de aislamiento estricto de Swift 6.
    outcome: escribes código asíncrono libre de data races y migras APIs basadas en callbacks a async/await.
  - id: s09
    number: 9
    title: Datos, arquitectura y testing en iOS
    summary: Networking, persistencia, arquitectura de pantallas y servicios, y pruebas automatizadas.
    outcome: construyes una capa de datos testeable, eliges una arquitectura por sus trade-offs y la cubres con pruebas.
  - id: s10
    number: 10
    title: SwiftUI de cero a producción
    summary: El modelo declarativo, el flujo de estado con Observation y la arquitectura de apps SwiftUI reales.
    outcome: construyes apps SwiftUI con estado bien ubicado, navegación por valores y datos remotos y locales.
  - id: s11
    number: 11
    title: Integración UIKit y SwiftUI
    summary: Apps híbridas, que son la norma en empresas con código existente.
    outcome: integras vistas SwiftUI en UIKit y componentes UIKit en SwiftUI con ciclos de vida bien gestionados.
  - id: s12
    number: 12
    title: Calidad profesional y seguridad
    summary: Lo que separa una app que funciona de una lista para producción, incluida la seguridad exigida en banca.
    outcome: preparas una app para distribución, la proteges según OWASP MASVS y mides rendimiento y accesibilidad.
  - id: s13
    number: 13
    title: Tecnologías del sistema (rutas opcionales)
    summary: Frameworks de Apple que se estudian según el producto. No son requisito para avanzar.
    outcome: integras widgets, Live Activities, notificaciones y otros frameworks con sus permisos y entitlements.
  - id: s14
    number: 14
    title: Entrevistas técnicas de iOS
    summary: Método de resolución en voz alta, banco de preguntas, simulaciones y mobile system design.
    outcome: resuelves retos de nivel medio en tiempo de entrevista y defiendes decisiones técnicas ante seguimientos.
  - id: s15
    number: 15
    title: Ejercer como iOS Engineer
    summary: Proyecto final y hábitos del trabajo profesional en un equipo.
    outcome: entregas un proyecto completo documentado y te desenvuelves en código heredado, revisiones e incidentes.

modules:
  # ---------------- Etapa 1 ----------------
  - id: m01
    stage: s01
    number: 1
    title: Introducción a la programación
    summary: Qué es un programa, qué hace un compilador y cómo se relacionan Swift, Xcode e iOS.
    objectives:
      - Explicar qué es un algoritmo y qué hace a uno correcto.
      - Describir el camino del código fuente al código máquina y el papel del compilador y del runtime.
      - Distinguir aplicación, sistema operativo, frontend y backend.
      - Describir el ciclo de desarrollo de una app iOS.
    topics: [Qué es programar, Qué es un algoritmo, Cómo se ejecuta un programa, Lenguajes compilados e interpretados, Código fuente y código máquina, Compilador, Runtime, IDE, Terminal, Aplicación, Frontend backend y sistema operativo, Swift Xcode e iOS, Ciclo de desarrollo]
  - id: m02
    stage: s01
    number: 2
    title: Pensamiento computacional
    summary: Herramientas para pensar un problema antes de escribir una sola línea de código.
    prerequisites: [m01]
    objectives:
      - Descomponer un problema en pasos pequeños y verificables.
      - Escribir pseudocódigo y diagramas de flujo para un algoritmo.
      - Ejecutar un algoritmo a mano con una tabla de seguimiento.
      - Identificar casos límite antes de programar.
    topics: [Descomposición, Reconocimiento de patrones, Abstracción, Diseño de algoritmos, Pseudocódigo, Diagramas de flujo, Tablas de seguimiento, Descomposición en funciones, Ejecución manual, Casos límite]
  - id: m03
    stage: s01
    number: 3
    title: Entorno de desarrollo
    summary: Instalar y usar Xcode, ejecutar código, depurar y leer los mensajes del compilador.
    prerequisites: [m01]
    objectives:
      - Crear y ejecutar un proyecto en Xcode y un Swift Package desde la terminal.
      - Usar breakpoints y la consola para inspeccionar un programa.
      - Distinguir errores de compilación, errores de ejecución y advertencias.
      - Encontrar una API en la documentación oficial.
    topics: [Xcode, Organización de proyectos, Archivos fuente, Compilación y ejecución, Simuladores, Consola, Breakpoints, Variables de depuración, Errores de compilación, Errores de ejecución, Advertencias, Mensajes del compilador, Documentación]

  # ---------------- Etapa 2 ----------------
  - id: m04
    stage: s02
    number: 4
    title: Primeros programas
    summary: Valores, operadores, variables, constantes y tipos. Tus primeras líneas de Swift.
    prerequisites: [m03]
    objectives:
      - Escribir y predecir la salida de programas con print e interpolación.
      - Usar let y var correctamente y explicar la inferencia de tipos.
      - Evaluar expresiones con precedencia de operadores.
      - Convertir entre tipos numéricos y texto de forma explícita.
    topics: [print, Comentarios, Literales, Expresiones, Operadores aritméticos, Operadores de comparación, Operadores lógicos, Precedencia, Variables, Constantes, Tipos de datos, Inferencia de tipos, Anotaciones de tipos, Conversión de tipos, Interpolación]
  - id: m05
    stage: s02
    number: 5
    title: Control del flujo
    summary: Tomar decisiones y repetir trabajo sin perder el control del programa.
    prerequisites: [m04]
    objectives:
      - Elegir entre if, switch y guard según el problema.
      - Escribir ciclos for-in, while y repeat-while que terminan.
      - Usar break y continue con intención.
      - Validar entradas antes de usarlas.
    topics: [if, else, else if, switch, for-in, while, repeat-while, break, continue, Bucles anidados, Condiciones compuestas, Validación de entradas, Errores comunes con ciclos]
  - id: m06
    stage: s02
    number: 6
    title: Funciones
    summary: Nombrar un procedimiento, recibir datos y devolver resultados. La herramienta principal para descomponer problemas.
    prerequisites: [m05]
    objectives:
      - Declarar funciones con parámetros, etiquetas y valores de retorno.
      - Explicar el alcance de una variable.
      - Pasar funciones como argumentos.
      - Escribir funciones recursivas con caso base.
    topics: [Declaración, Parámetros, Argumentos, Valores de retorno, Funciones sin retorno, Etiquetas externas e internas, Valores predeterminados, Tuplas como retorno, Funciones que reciben funciones, Alcance, Recursión, Funciones puras]
  - id: m07
    stage: s02
    number: 7
    title: Colecciones
    summary: Array, Set y Dictionary, y las transformaciones que se usan a diario y en entrevistas.
    prerequisites: [m06]
    objectives:
      - Elegir la colección correcta según orden, unicidad y búsqueda.
      - Acceder a elementos de forma segura.
      - Transformar colecciones con map, filter, reduce y compañía.
      - Contar frecuencias y agrupar datos.
    topics: [Arrays, Sets, Dictionaries, Índices, Inserción y eliminación, Búsqueda, Iteración, Mutabilidad, Copia y modificación, Acceso seguro, map, filter, reduce, compactMap, flatMap, sorted, contains, first(where:), allSatisfy, zip, Colecciones anidadas, Frecuencias, Agrupación]
  - id: m08
    stage: s02
    number: 8
    title: Optionals y manejo seguro de valores
    summary: Cómo representa Swift la ausencia de un valor y por qué eso evita una categoría entera de fallos.
    prerequisites: [m07]
    objectives:
      - Desempaquetar optionals con if let, guard let y switch.
      - Usar optional chaining y nil-coalescing.
      - Justificar cuándo nunca usar force unwrapping.
      - Diseñar funciones que devuelven optionals.
    topics: [Por qué existen, Optional, nil, if let, guard let, switch sobre optionals, Optional chaining, Nil-coalescing, Force unwrapping, Optionals anidados, Cuándo devolver nil, Diseño de APIs]

  # ---------------- Etapa 3 ----------------
  - id: m09
    stage: s03
    number: 9
    title: Modelado de datos
    summary: struct, class y enum, sus propiedades, métodos e inicializadores.
    prerequisites: [m08]
    objectives:
      - Modelar un dominio con structs y enums.
      - Escribir inicializadores y propiedades calculadas.
      - Usar property observers y miembros de tipo.
      - Modelar estados con associated values y pattern matching.
    topics: [struct, class, enum, Propiedades almacenadas, Propiedades calculadas, Métodos, Inicializadores, self, mutating, Tipos anidados, Property observers, willSet, didSet, Type properties, Type methods, Raw values, Associated values, Pattern matching]
  - id: m10
    stage: s03
    number: 10
    title: Programación orientada a objetos y protocolos
    summary: Semántica de valor y de referencia, herencia, composición y diseño orientado a protocolos.
    prerequisites: [m09]
    objectives:
      - Explicar la diferencia entre tipos por valor y por referencia con ejemplos.
      - Diseñar abstracciones con protocolos y extensiones.
      - Distinguir any de some.
      - Elegir entre struct, class y enum con criterios explícitos.
    topics: [Tipos por valor, Tipos por referencia, Stack y heap como modelo conceptual, Identidad y equivalencia, Herencia, Polimorfismo, Encapsulación, Composición, Protocolos, Extensiones, Protocol extensions, Associated types, Existentials, any, some, Protocol-oriented programming, Dependency inversion]
  - id: m11
    stage: s03
    number: 11
    title: Generics y programación funcional
    summary: Código reutilizable con tipos genéricos y funciones como valores.
    prerequisites: [m10]
    objectives:
      - Escribir funciones y tipos genéricos con restricciones.
      - Explicar la captura de variables en closures y usar capture lists.
      - Distinguir closures escapantes de no escapantes.
      - Decidir entre una solución funcional y una imperativa.
    topics: [Funciones genéricas, Tipos genéricos, Constraints, where, Associated types, Higher-order functions, Closures, Captura de variables, Capture lists, "@escaping", "@autoclosure", Funciones como valores, Composición]
  - id: m12
    stage: s03
    number: 12
    title: Manejo de errores
    summary: Diseñar, lanzar, propagar y manejar errores, incluidos typed throws.
    prerequisites: [m11]
    objectives:
      - Diseñar tipos de error de dominio.
      - Elegir entre try, try? y try! con justificación.
      - Separar errores de dominio de errores de infraestructura.
    topics: [Error, Enums de error, throw, throws, try, try?, try!, do-catch, Propagación, Typed throws, Errores recuperables, Validación, Errores de dominio e infraestructura]
  - id: m13
    stage: s03
    number: 13
    title: Memoria y ARC
    summary: Quién es dueño de un objeto, cuándo se libera y cómo se fuga.
    prerequisites: [m12]
    objectives:
      - Explicar cómo ARC cuenta referencias fuertes.
      - Romper ciclos de retención con weak y unowned.
      - Detectar fugas con el Memory Graph Debugger.
    topics: [Gestión de memoria, ARC, Ciclo de vida de objetos, strong, weak, unowned, Reference cycles, Captura de self, Memory leaks, Diagnóstico, Propiedad de recursos]

  # ---------------- Etapa 4 ----------------
  - id: m14
    stage: s04
    number: 14
    title: Herramientas profesionales
    summary: Paquetes, control de versiones y principios de diseño que usarás todos los días en un equipo.
    prerequisites: [m13]
    objectives:
      - Crear un Swift Package con varios targets y dependencias.
      - Trabajar con ramas, merges, conflictos y pull requests.
      - Revisar código con criterios explícitos.
      - Aplicar SOLID sin sobrediseñar.
    topics: [Swift Package Manager, Módulos, Dependencias, Git, Commits, Branches, Merge, Conflictos, Pull requests, .gitignore, Code review, Convenciones de nombres, Refactorización, SOLID, Separación de responsabilidades, Documentación]

  # ---------------- Etapa 5 ----------------
  - id: m15
    stage: s05
    number: 15
    title: Complejidad algorítmica
    summary: Medir cuánto crece el trabajo y la memoria de un algoritmo y comparar soluciones.
    prerequisites: [m07]
    objectives:
      - Derivar la complejidad de ciclos simples y anidados.
      - Conocer el costo de las operaciones de Array, Set, Dictionary y String en Swift.
      - Argumentar trade-offs entre tiempo y memoria.
    topics: [Big O, Tiempo y espacio, "O(1)", "O(log n)", "O(n)", "O(n log n)", "O(n²)", Complejidades superiores, Análisis de bucles, Costo de colecciones, Trade-offs]
  - id: m16
    stage: s05
    number: 16
    title: Arrays, hashing y ventanas
    summary: Los patrones de entrevista más frecuentes sobre secuencias.
    prerequisites: [m15, m08]
    objectives:
      - Resolver problemas con hash maps y contadores de frecuencia.
      - Aplicar two pointers y sliding window.
      - Usar prefix sums y búsqueda binaria.
    topics: [Recorrido lineal, Búsqueda lineal, Búsqueda binaria, Two pointers, Sliding window, Hash maps, Frequency counters, Prefix sums]
  - id: m17
    stage: s05
    number: 17
    title: Pilas, colas y listas enlazadas
    summary: Estructuras lineales implementadas desde cero en Swift.
    prerequisites: [m16, m10]
    objectives:
      - Implementar Stack y Queue con sus complejidades.
      - Manipular listas enlazadas con punteros rápido y lento.
      - Reconocer problemas de pila monótona.
    topics: [Stack, Queue, Deque, Linked lists, Fast y slow pointers, Pila monótona]
  - id: m18
    stage: s05
    number: 18
    title: Recursión, backtracking y ordenamiento
    summary: Pensar en subproblemas, explorar alternativas y ordenar datos.
    prerequisites: [m17]
    objectives:
      - Escribir soluciones recursivas y backtracking con poda.
      - Implementar merge sort y quicksort y analizar su costo.
      - Aplicar divide y vencerás.
    topics: [Recursión, Backtracking, Sorting, Merge sort, Quicksort, Divide and conquer]
  - id: m19
    stage: s05
    number: 19
    title: Árboles, heaps y grafos
    summary: Estructuras no lineales y sus recorridos.
    prerequisites: [m18]
    objectives:
      - Recorrer árboles con DFS y BFS.
      - Implementar un heap y usarlo como priority queue.
      - Modelar grafos y recorrerlos con BFS y DFS.
    topics: [Árboles, Binary search trees, Tries, Heaps, Priority queues, Grafos, BFS, DFS, Topological sort, Union-find]
  - id: m20
    stage: s05
    number: 20
    title: Algoritmos voraces y programación dinámica
    summary: Decisiones locales y subproblemas solapados.
    prerequisites: [m19]
    objectives:
      - Justificar cuándo un algoritmo voraz es correcto.
      - Resolver problemas con memoization y tabulation.
      - Reconocer problemas de programación dinámica en el enunciado.
    topics: [Greedy, Introducción a dynamic programming, Memoization, Tabulation, DP 1-D, DP 2-D, Intervalos]

  # ---------------- Etapa 6 ----------------
  - id: m21
    stage: s06
    number: 21
    title: Cómo funciona una app iOS
    summary: Proceso, bundle, ciclo de vida de la app y de las escenas, hilo principal, firma y configuración.
    prerequisites: [m14]
    objectives:
      - Explicar el ciclo de vida de app y de escena, obligatorio en apps compiladas con el SDK de iOS 27.
      - Describir el hilo principal y el run loop.
      - Configurar targets, firma, deployment target y entornos.
      - Distinguir qué es del lenguaje Swift y qué del SDK.
    topics: [Arquitectura de una app, Targets, Bundle, Assets, Info.plist, Entry point, App lifecycle, Scene lifecycle, Main thread, Run loop, Renderizado, Eventos, Permisos, Sandboxing, Signing, Provisioning profiles, Deployment target, Frameworks, Configuración por entorno, Secretos de configuración, Logs, Símbolos, Introducción al profiling]

  # ---------------- Etapa 7 ----------------
  - id: m22
    stage: s07
    number: 22
    title: Fundamentos de UIKit
    summary: Ventanas, escenas, view controllers, vistas y la cadena de respondedores.
    prerequisites: [m21]
    objectives:
      - Construir una pantalla programática y otra con Storyboard.
      - Explicar el ciclo de vida de UIViewController.
      - Usar target-action y delegation.
    topics: [UIApplication, UIWindowScene, UIWindow, UIViewController, UIView, View hierarchy, viewDidLoad, viewWillAppear, viewDidAppear, viewWillDisappear, viewDidDisappear, Responder chain, Target-action, Delegation, IBAction, IBOutlet, Programmatic UI, Storyboards, XIBs]
  - id: m23
    stage: s07
    number: 23
    title: Layout en UIKit
    summary: Frames, Auto Layout y adaptación a cualquier pantalla y tamaño de texto.
    prerequisites: [m22]
    objectives:
      - Distinguir frame de bounds.
      - Escribir constraints sin ambigüedad.
      - Resolver conflictos con hugging y compression resistance.
      - Adaptar layouts a Dynamic Type.
    topics: [Frames, Bounds, Center, Sistemas de coordenadas, Auto Layout, Constraints, Intrinsic content size, Content hugging, Compression resistance, Safe areas, Layout margins, Stack views, Scroll views, Dynamic Type, Layout debugging]
  - id: m24
    stage: s07
    number: 24
    title: Componentes y listas
    summary: Controles estándar y listas modernas con collection views, diffable data sources y compositional layout.
    prerequisites: [m23]
    objectives:
      - Usar los controles estándar con accesibilidad.
      - Construir listas con UITableView y con UICollectionView moderno.
      - Explicar la reutilización de celdas.
    topics: [UILabel, UIButton, UITextField, UITextView, UIImageView, UISwitch, UISlider, UISegmentedControl, UIActivityIndicatorView, UIAlertController, UIStackView, UIScrollView, UITableView, UICollectionView, Diffable data sources, Cell registration, Reusable cells, Compositional layout]
  - id: m25
    stage: s07
    number: 25
    title: Navegación en UIKit
    summary: Navigation controllers, tabs, modales, coordinators y deep links.
    prerequisites: [m24]
    objectives:
      - Pasar datos entre pantallas y devolver resultados.
      - Implementar el patrón coordinator.
      - Manejar deep links.
    topics: [UINavigationController, UITabBarController, Modal presentation, Push y pop, Coordinators, Deep links, Estado de navegación, Paso de datos, Devolución de resultados]
  - id: m26
    stage: s07
    number: 26
    title: Eventos y comunicación entre componentes
    summary: Delegates, closures, NotificationCenter y cuándo usar cada uno.
    prerequisites: [m25, m13]
    objectives:
      - Elegir el mecanismo de comunicación adecuado.
      - Evitar ciclos de retención en closures y delegates.
    topics: [Delegates, Closures, NotificationCenter, Target-action, Data sources, Callbacks, Retain cycles, Selección de mecanismos]
  - id: m27
    stage: s07
    number: 27
    title: UIKit avanzado
    summary: Animaciones, gestos, dibujo, rendimiento de scroll, accesibilidad y localización.
    prerequisites: [m26]
    objectives:
      - Animar con UIView y Core Animation.
      - Implementar gestos personalizados.
      - Lograr scroll fluido con carga y caché de imágenes.
      - Hacer una pantalla accesible y localizable.
    topics: [Animaciones, Core Animation, Gestures, Drawing, Core Graphics, Renderizado, Scroll performance, Caché de imágenes, Accesibilidad, Localización, Internacionalización, Dynamic Type, Universal links]

  # ---------------- Etapa 8 ----------------
  - id: m28
    stage: s08
    number: 28
    title: Hilos, colas y GCD
    summary: Proceso, hilo, bloqueo, concurrencia y paralelismo, y el modelo clásico con Grand Central Dispatch.
    prerequisites: [m26]
    objectives:
      - Distinguir proceso, hilo, concurrencia y paralelismo.
      - Usar DispatchQueue y OperationQueue con completion handlers.
      - Identificar race conditions y deadlocks.
    topics: [Operación, Bloqueo, Trabajo asíncrono, Proceso, Hilo, Concurrencia y paralelismo, Main thread, GCD, DispatchQueue, OperationQueue, Completion handlers, Race conditions, Deadlocks]
  - id: m29
    stage: s08
    number: 29
    title: Swift Concurrency
    summary: async/await, tareas estructuradas, actors y Sendable, con el aislamiento estricto de Swift 6.
    prerequisites: [m28]
    objectives:
      - Distinguir con precisión un thread de una Task.
      - Usar async let, TaskGroup y cancelación.
      - Aislar estado con actors y @MainActor.
      - Corregir diagnósticos de Sendable y de aislamiento.
      - Migrar APIs de callbacks con continuations.
    topics: [Structured concurrency, async, await, Task, TaskGroup, async let, Actors, "@MainActor", Sendable, Data races, Cancellation, Task priority, Aislamiento, Default MainActor isolation, Continuations, Migración a Swift 6]

  # ---------------- Etapa 9 ----------------
  - id: m30
    stage: s09
    number: 30
    title: Networking
    summary: HTTP, JSON y URLSession con async/await, errores, cancelación, paginación y autenticación.
    prerequisites: [m29]
    objectives:
      - Construir un cliente HTTP testeable.
      - Decodificar respuestas y manejar respuestas inválidas.
      - Implementar reintentos, paginación y cancelación.
    topics: [HTTP, REST, Métodos, Status codes, Headers, JSON, Codable, URLRequest, URLSession, Errores de red, Timeouts, Cancelación, Reintentos, Paginación, Autenticación, Repository pattern, Mocking]
  - id: m31
    stage: s09
    number: 31
    title: Persistencia
    summary: UserDefaults, archivos, Keychain, Core Data y SwiftData, y cómo elegir entre ellos.
    prerequisites: [m30]
    objectives:
      - Elegir almacenamiento según el tipo y sensibilidad del dato.
      - Persistir modelos con Core Data y SwiftData.
      - Planear migraciones y caché.
    topics: [UserDefaults, FileManager, Codable y JSON, Keychain, Core Data, SwiftData, Migraciones, Cache, Sincronización, Conflictos]
  - id: m32
    stage: s09
    number: 32
    title: Arquitectura de apps
    summary: MVC, MVVM, MVP, Clean Architecture y coordinators, comparados en la misma app.
    prerequisites: [m31]
    objectives:
      - Comparar arquitecturas por los problemas que resuelven.
      - Separar dominio, presentación e infraestructura.
      - Inyectar dependencias sin frameworks.
    topics: [MVC, MVVM, MVP, Clean Architecture, Coordinators, Dependency Injection, Repository, Service layer, Use cases, Modularización, Trade-offs]
  - id: m33
