# Course map. Each module declares its prerequisites (they must come earlier in the numbering).
# Lessons live in content/lessons/<module>/ and reference the module id.

stages:
  - id: s01
    number: 1
    title: Programming Fundamentals
    summary: What programming is, how to think through a problem before writing code, and what the environment you'll work in looks like.
    outcome: you can describe how a program becomes something the computer runs, and you solve simple problems in pseudocode.
  - id: s02
    number: 2
    title: Swift Essentials
    summary: Values, types, decisions, repetition, functions, collections and optionals. Everything else is built on this.
    outcome: you write correct console programs in Swift and read compiler errors without fear.
  - id: s03
    number: 3
    title: Intermediate and Advanced Swift
    summary: Modeling data with struct, class and enum; protocols, generics, closures, errors, and memory with ARC.
    outcome: you pick the right type for each model, design APIs with protocols and generics, and avoid retain cycles.
  - id: s04
    number: 4
    title: Tools and Software Engineering
    summary: Swift Package Manager, Git, code review, and design principles applied to Swift.
    outcome: you work in a repository with branches and pull requests, organize code into modules, and justify design decisions.
  - id: s05
    number: 5
    title: Algorithms and Data Structures
    summary: Complexity and the patterns that come up most in interviews, implemented and tested in Swift.
    outcome: you recognize a problem's pattern from its statement, solve it in Swift, and defend its complexity.
  - id: s06
    number: 6
    title: iOS Development Fundamentals
    summary: How an app lives on iOS before you draw the first screen. What belongs to the language and what belongs to the system.
    outcome: you explain the life cycle of an app and its scenes, and you set up signing, targets and environments.
  - id: s07
    number: 7
    title: UIKit from Zero to Advanced
    summary: The UI framework that most production apps were built with and are still maintained in.
    outcome: you build and maintain complex UIKit interfaces, in code or with Storyboards, with modern lists and navigation.
  - id: s08
    number: 8
    title: Concurrency and Memory
    summary: Threads, queues, and Swift Concurrency under Swift 6's strict isolation model.
    outcome: you write asynchronous code free of data races and migrate callback-based APIs to async/await.
  - id: s09
    number: 9
    title: Data, Architecture and Testing on iOS
    summary: Networking, persistence, screen and service architecture, and automated tests.
    outcome: you build a testable data layer, choose an architecture by its trade-offs, and cover it with tests.
  - id: s10
    number: 10
    title: SwiftUI from Zero to Production
    summary: The declarative model, state flow with Observation, and the architecture of real SwiftUI apps.
    outcome: you build SwiftUI apps with well-placed state, value-based navigation, and remote and local data.
  - id: s11
    number: 11
    title: UIKit and SwiftUI Integration
    summary: Hybrid apps, which are the norm at companies with an existing codebase.
    outcome: you embed SwiftUI views in UIKit and UIKit components in SwiftUI, with their life cycles handled correctly.
  - id: s12
    number: 12
    title: Professional Quality and Security
    summary: What separates an app that works from one that's ready for production, including the security banks require.
    outcome: you prepare an app for distribution, protect it according to OWASP MASVS, and measure performance and accessibility.
  - id: s13
    number: 13
    title: System Technologies (Optional Tracks)
    summary: Apple frameworks you study depending on the product. You don't need them to move forward.
    outcome: you integrate widgets, Live Activities, notifications and other frameworks with their permissions and entitlements.
  - id: s14
    number: 14
    title: iOS Technical Interviews
    summary: A method for solving problems out loud, a question bank, mock interviews, and mobile system design.
    outcome: you solve medium-level challenges within interview time and defend technical decisions under follow-up questions.
  - id: s15
    number: 15
    title: Working as an iOS Engineer
    summary: A final project and the habits of professional work on a team.
    outcome: you deliver a complete, documented project and hold your own with legacy code, reviews and incidents.

modules:
  # ---------------- Stage 1 ----------------
  - id: m01
    stage: s01
    number: 1
    title: Introduction to Programming
    summary: What a program is, what a compiler does, and how Swift, Xcode and iOS fit together.
    objectives:
      - Explain what an algorithm is and what makes one correct.
      - Describe the path from source code to machine code and the roles of the compiler and the runtime.
      - Tell apart an application, the operating system, the frontend and the backend.
      - Describe the development cycle of an iOS app.
    topics: [What programming is, What an algorithm is, How a program runs, Compiled and interpreted languages, Source code and machine code, Compiler, Runtime, IDE, Terminal, Application, Frontend backend and operating system, Swift Xcode and iOS, Development cycle]
  - id: m02
    stage: s01
    number: 2
    title: Computational Thinking
    summary: Tools for thinking through a problem before you write a single line of code.
    prerequisites: [m01]
    objectives:
      - Break a problem into small, checkable steps.
      - Write pseudocode and flowcharts for an algorithm.
      - Run an algorithm by hand with a trace table.
      - Identify edge cases before you start coding.
    topics: [Decomposition, Pattern recognition, Abstraction, Algorithm design, Pseudocode, Flowcharts, Trace tables, Breaking a problem into functions, Running by hand, Edge cases]
  - id: m03
    stage: s01
    number: 3
    title: Development Environment
    summary: Installing and using Xcode, running code, debugging, and reading compiler messages.
    prerequisites: [m01]
    objectives:
      - Create and run a project in Xcode and a Swift package from the terminal.
      - Use breakpoints and the console to inspect a program.
      - Tell apart compile errors, runtime errors and warnings.
      - Find an API in the official documentation.
    topics: [Xcode, Project organization, Source files, Building and running, Simulators, Console, Breakpoints, Debug variables, Compile errors, Runtime errors, Warnings, Compiler messages, Documentation]

  # ---------------- Stage 2 ----------------
  - id: m04
    stage: s02
    number: 4
    title: First Programs
    summary: Values, operators, variables, constants and types. Your first lines of Swift.
    prerequisites: [m03]
    objectives:
      - Write programs with print and interpolation, and predict their output.
      - Use let and var correctly and explain type inference.
      - Evaluate expressions using operator precedence.
      - Convert explicitly between numeric types and text.
    topics: [print, Comments, Literals, Expressions, Arithmetic operators, Comparison operators, Logical operators, Precedence, Variables, Constants, Data types, Type inference, Type annotations, Type conversion, Interpolation]
  - id: m05
    stage: s02
    number: 5
    title: Control Flow
    summary: Making decisions and repeating work without losing control of the program.
    prerequisites: [m04]
    objectives:
      - Choose between if, switch and guard based on the problem.
      - Write for-in, while and repeat-while loops that terminate.
      - Use break and continue on purpose.
      - Validate input before you use it.
    topics: [if, else, else if, switch, for-in, while, repeat-while, break, continue, Nested loops, Compound conditions, Input validation, Common loop mistakes]
  - id: m06
    stage: s02
    number: 6
    title: Functions
    summary: Naming a procedure, taking in data and returning results. Your main tool for breaking problems apart.
    prerequisites: [m05]
    objectives:
      - Declare functions with parameters, argument labels and return values.
      - Explain the scope of a variable.
      - Pass functions as arguments.
      - Write recursive functions with a base case.
    topics: [Declaration, Parameters, Arguments, Return values, Functions without a return value, Argument labels and parameter names, Default values, Tuples as return values, Functions that take functions, Scope, Recursion, Pure functions]
  - id: m07
    stage: s02
    number: 7
    title: Collections
    summary: Array, Set and Dictionary, and the transformations you use every day and in interviews.
    prerequisites: [m06]
    objectives:
      - Pick the right collection based on order, uniqueness and lookup.
      - Access elements safely.
      - Transform collections with map, filter, reduce and friends.
      - Count frequencies and group data.
    topics: [Arrays, Sets, Dictionaries, Indices, Insertion and removal, Searching, Iteration, Mutability, Copying and modifying, Safe access, map, filter, reduce, compactMap, flatMap, sorted, contains, first(where:), allSatisfy, zip, Nested collections, Frequencies, Grouping]
  - id: m08
    stage: s02
    number: 8
    title: Optionals and Safe Value Handling
    summary: How Swift represents a missing value and why that rules out a whole category of crashes.
    prerequisites: [m07]
    objectives:
      - Unwrap optionals with if let, guard let and switch.
      - Use optional chaining and nil-coalescing.
      - Justify when never to force unwrap.
      - Design functions that return optionals.
    topics: [Why they exist, Optional, nil, if let, guard let, switch on optionals, Optional chaining, Nil-coalescing, Force unwrapping, Nested optionals, When to return nil, API design]

  # ---------------- Stage 3 ----------------
  - id: m09
    stage: s03
    number: 9
    title: Data Modeling
    summary: struct, class and enum, with their properties, methods and initializers.
    prerequisites: [m08]
    objectives:
      - Model a domain with structs and enums.
      - Write initializers and computed properties.
      - Use property observers and type members.
      - Model states with associated values and pattern matching.
    topics: [struct, class, enum, Stored properties, Computed properties, Methods, Initializers, self, mutating, Nested types, Property observers, willSet, didSet, Type properties, Type methods, Raw values, Associated values, Pattern matching]
  - id: m10
    stage: s03
    number: 10
    title: Object-Oriented Programming and Protocols
    summary: Value and reference semantics, inheritance, composition, and protocol-oriented design.
    prerequisites: [m09]
    objectives:
      - Explain the difference between value types and reference types with examples.
      - Design abstractions with protocols and extensions.
      - Tell any apart from some.
      - Choose between struct, class and enum with explicit criteria.
    topics: [Value types, Reference types, Stack and heap as a mental model, Identity and equality, Inheritance, Polymorphism, Encapsulation, Composition, Protocols, Extensions, Protocol extensions, Associated types, Existentials, any, some, Protocol-oriented programming, Dependency inversion]
  - id: m11
    stage: s03
    number: 11
    title: Generics and Functional Programming
    summary: Reusable code with generic types and functions as values.
    prerequisites: [m10]
    objectives:
      - Write generic functions and types with constraints.
      - Explain how closures capture variables and use capture lists.
      - Tell escaping closures apart from non-escaping ones.
      - Decide between a functional and an imperative solution.
    topics: [Generic functions, Generic types, Constraints, where, Associated types, Higher-order functions, Closures, Capturing variables, Capture lists, "@escaping", "@autoclosure", Functions as values, Composition]
  - id: m12
    stage: s03
    number: 12
    title: Error Handling
    summary: Designing, throwing, propagating and handling errors, including typed throws.
    prerequisites: [m11]
    objectives:
      - Design domain error types.
      - Choose between try, try? and try! and justify the choice.
      - Keep domain errors separate from infrastructure errors.
    topics: [Error, Error enums, throw, throws, try, "try?", "try!", do-catch, Propagation, Typed throws, Recoverable errors, Validation, Domain and infrastructure errors]
  - id: m13
    stage: s03
    number: 13
    title: Memory and ARC
    summary: Who owns an object, when it's freed, and how it leaks.
    prerequisites: [m12]
    objectives:
      - Explain how ARC counts strong references.
      - Break retain cycles with weak and unowned.
      - Find leaks with the Memory Graph Debugger.
    topics: [Memory management, ARC, Object life cycle, strong, weak, unowned, Reference cycles, Capturing self, Memory leaks, Diagnosis, Resource ownership]

  # ---------------- Stage 4 ----------------
  - id: m14
    stage: s04
    number: 14
    title: Professional Tools
    summary: Packages, version control, and the design principles you'll use every day on a team.
    prerequisites: [m13]
    objectives:
      - Create a Swift package with several targets and dependencies.
      - Work with branches, merges, conflicts and pull requests.
      - Review code against explicit criteria.
      - Apply SOLID without overengineering.
    topics: [Swift Package Manager, Modules, Dependencies, Git, Commits, Branches, Merge, Conflicts, Pull requests, .gitignore, Code review, Naming conventions, Refactoring, SOLID, Separation of concerns, Documentation]

  # ---------------- Stage 5 ----------------
  - id: m15
    stage: s05
    number: 15
    title: Algorithmic Complexity
    summary: Measuring how an algorithm's work and memory grow, and comparing solutions.
    prerequisites: [m07]
    objectives:
      - Derive the complexity of simple and nested loops.
      - Know the cost of Array, Set, Dictionary and String operations in Swift.
      - Argue time and memory trade-offs.
    topics: [Big O, Time and space, "O(1)", "O(log n)", "O(n)", "O(n log n)", "O(n²)", Higher complexities, Loop analysis, Cost of collections, Trade-offs]
  - id: m16
    stage: s05
    number: 16
    title: Arrays, Hashing and Windows
    summary: The most common interview patterns on sequences.
    prerequisites: [m15, m08]
    objectives:
      - Solve problems with hash maps and frequency counters.
      - Apply two pointers and sliding window.
      - Use prefix sums and binary search.
    topics: [Linear traversal, Linear search, Binary search, Two pointers, Sliding window, Hash maps, Frequency counters, Prefix sums]
  - id: m17
    stage: s05
    number: 17
    title: Stacks, Queues and Linked Lists
    summary: Linear data structures built from scratch in Swift.
    prerequisites: [m16, m10]
    objectives:
      - Implement Stack and Queue and state their complexities.
      - Manipulate linked lists with fast and slow pointers.
      - Recognize monotonic stack problems.
    topics: [Stack, Queue, Deque, Linked lists, Fast and slow pointers, Monotonic stack]
  - id: m18
    stage: s05
    number: 18
    title: Recursion, Backtracking and Sorting
    summary: Thinking in subproblems, exploring alternatives, and sorting data.
    prerequisites: [m17]
    objectives:
      - Write recursive and backtracking solutions with pruning.
      - Implement merge sort and quicksort and analyze their cost.
      - Apply divide and conquer.
    topics: [Recursion, Backtracking, Sorting, Merge sort, Quicksort, Divide and conquer]
  - id: m19
    stage: s05
    number: 19
    title: Trees, Heaps and Graphs
    summary: Nonlinear data structures and how to traverse them.
    prerequisites: [m18]
    objectives:
      - Traverse trees with DFS and BFS.
      - Implement a heap and use it as a priority queue.
      - Model graphs and traverse them with BFS and DFS.
    topics: [Trees, Binary search trees, Tries, Heaps, Priority queues, Graphs, BFS, DFS, Topological sort, Union-find]
  - id: m20
    stage: s05
    number: 20
    title: Greedy Algorithms and Dynamic Programming
    summary: Local decisions and overlapping subproblems.
    prerequisites: [m19]
    objectives:
      - Justify when a greedy algorithm is correct.
      - Solve problems with memoization and tabulation.
      - Spot dynamic programming problems from the statement.
    topics: [Greedy, Introduction to dynamic programming, Memoization, Tabulation, 1-D DP, 2-D DP, Intervals]

  # ---------------- Stage 6 ----------------
  - id: m21
    stage: s06
    number: 21
    title: How an iOS App Works
    summary: The process, the bundle, the app and scene life cycles, the main thread, signing and configuration.
    prerequisites: [m14]
    objectives:
      - Explain the app and scene life cycles, which are required for apps built with the iOS 27 SDK.
      - Describe the main thread and the run loop.
      - Configure targets, signing, the deployment target and environments.
      - Tell what belongs to the Swift language from what belongs to the SDK.
    topics: [App architecture, Targets, Bundle, Assets, Info.plist, Entry point, App lifecycle, Scene lifecycle, Main thread, Run loop, Rendering, Events, Permissions, Sandboxing, Signing, Provisioning profiles, Deployment target, Frameworks, Per-environment configuration, Configuration secrets, Logs, Symbols, Introduction to profiling]

  # ---------------- Stage 7 ----------------
  - id: m22
    stage: s07
    number: 22
    title: UIKit Fundamentals
    summary: Windows, scenes, view controllers, views and the responder chain.
    prerequisites: [m21]
    objectives:
      - Build one screen in code and another with a Storyboard.
      - Explain the UIViewController life cycle.
      - Use target-action and delegation.
    topics: [UIApplication, UIWindowScene, UIWindow, UIViewController, UIView, View hierarchy, viewDidLoad, viewWillAppear, viewDidAppear, viewWillDisappear, viewDidDisappear, Responder chain, Target-action, Delegation, IBAction, IBOutlet, Programmatic UI, Storyboards, XIBs]
  - id: m23
    stage: s07
    number: 23
    title: Layout in UIKit
    summary: Frames, Auto Layout, and adapting to any screen and text size.
    prerequisites: [m22]
    objectives:
      - Tell frame apart from bounds.
      - Write constraints without ambiguity.
      - Resolve conflicts with hugging and compression resistance.
      - Adapt layouts to Dynamic Type.
    topics: [Frames, Bounds, Center, Coordinate systems, Auto Layout, Constraints, Intrinsic content size, Content hugging, Compression resistance, Safe areas, Layout margins, Stack views, Scroll views, Dynamic Type, Layout debugging]
  - id: m24
    stage: s07
    number: 24
    title: Components and Lists
    summary: Standard controls and modern lists with collection views, diffable data sources and compositional layout.
    prerequisites: [m23]
    objectives:
      - Use the standard controls with accessibility in mind.
      - Build lists with UITableView and with modern UICollectionView.
      - Explain cell reuse.
    topics: [UILabel, UIButton, UITextField, UITextView, UIImageView, UISwitch, UISlider, UISegmentedControl, UIActivityIndicatorView, UIAlertController, UIStackView, UIScrollView, UITableView, UICollectionView, Diffable data sources, Cell registration, Reusable cells, Compositional layout]
  - id: m25
    stage: s07
    number: 25
    title: Navigation in UIKit
    summary: Navigation controllers, tabs, modals, coordinators and deep links.
    prerequisites: [m24]
    objectives:
      - Pass data between screens and send results back.
      - Implement the coordinator pattern.
      - Handle deep links.
    topics: [UINavigationController, UITabBarController, Modal presentation, Push and pop, Coordinators, Deep links, Navigation state, Passing data, Returning results]
  - id: m26
    stage: s07
    number: 26
    title: Events and Communication Between Components
    summary: Delegates, closures, NotificationCenter, and when to use each one.
    prerequisites: [m25, m13]
    objectives:
      - Choose the right communication mechanism.
      - Avoid retain cycles in closures and delegates.
    topics: [Delegates, Closures, NotificationCenter, Target-action, Data sources, Callbacks, Retain cycles, Choosing a mechanism]
  - id: m27
    stage: s07
    number: 27
    title: Advanced UIKit
    summary: Animations, gestures, drawing, scroll performance, accessibility and localization.
    prerequisites: [m26]
    objectives:
      - Animate with UIView and Core Animation.
      - Implement custom gestures.
      - Get smooth scrolling with image loading and caching.
      - Make a screen accessible and localizable.
    topics: [Animations, Core Animation, Gestures, Drawing, Core Graphics, Rendering, Scroll performance, Image caching, Accessibility, Localization, Internationalization, Dynamic Type, Universal links]

  # ---------------- Stage 8 ----------------
  - id: m28
    stage: s08
    number: 28
    title: Threads, Queues and GCD
    summary: Processes, threads, blocking, concurrency and parallelism, and the classic Grand Central Dispatch model.
    prerequisites: [m26]
    objectives:
      - Tell apart process, thread, concurrency and parallelism.
      - Use DispatchQueue and OperationQueue with completion handlers.
      - Identify race conditions and deadlocks.
    topics: [Operations, Blocking, Asynchronous work, Process, Thread, Concurrency and parallelism, Main thread, GCD, DispatchQueue, OperationQueue, Completion handlers, Race conditions, Deadlocks]
  - id: m29
    stage: s08
    number: 29
    title: Swift Concurrency
    summary: async/await, structured tasks, actors and Sendable, under Swift 6's strict isolation.
    prerequisites: [m28]
    objectives:
      - Tell a thread apart from a Task, precisely.
      - Use async let, TaskGroup and cancellation.
      - Isolate state with actors and @MainActor.
      - Fix Sendable and isolation diagnostics.
      - Migrate callback APIs with continuations.
    topics: [Structured concurrency, async, await, Task, TaskGroup, async let, Actors, "@MainActor", Sendable, Data races, Cancellation, Task priority, Isolation, Default MainActor isolation, Continuations, Migrating to Swift 6]

  # ---------------- Stage 9 ----------------
  - id: m30
    stage: s09
    number: 30
    title: Networking
    summary: HTTP, JSON and URLSession with async/await, errors, cancellation, pagination and authentication.
    prerequisites: [m29]
    objectives:
      - Build a testable HTTP client.
      - Decode responses and handle invalid ones.
      - Implement retries, pagination and cancellation.
    topics: [HTTP, REST, Methods, Status codes, Headers, JSON, Codable, URLRequest, URLSession, Network errors, Timeouts, Cancellation, Retries, Pagination, Authentication, Repository pattern, Mocking]
  - id: m31
    stage: s09
    number: 31
    title: Persistence
    summary: UserDefaults, files, Keychain, Core Data and SwiftData, and how to choose between them.
    prerequisites: [m30]
    objectives:
      - Choose storage based on the kind of data and how sensitive it is.
      - Persist models with Core Data and SwiftData.
      - Plan migrations and caching.
    topics: [UserDefaults, FileManager, Codable and JSON, Keychain, Core Data, SwiftData, Migrations, Cache, Sync, Conflicts]
  - id: m32
    stage: s09
    number: 32
    title: App Architecture
    summary: MVC, MVVM, MVP, Clean Architecture and coordinators, compared in the same app.
    prerequisites: [m31]
    objectives:
      - Compare architectures by the problems they solve.
      - Separate domain, presentation and infrastructure.
      - Inject dependencies without a framework.
    topics: [MVC, MVVM, MVP, Clean Architecture, Coordinators, Dependency Injection, Repository, Service layer, Use cases, Modularization, Trade-offs]
  - id: m33
    stage: s09
    number: 33
    title: Testing and Debugging
    summary: Swift Testing and XCTest, test doubles, async tests, UI tests and Instruments.
    prerequisites: [m32]
    objectives:
      - Write unit tests with Swift Testing and XCTest.
      - Use mocks, stubs and fakes through injection.
      - Test asynchronous code.
      - Profile with Instruments and the Memory Graph.
    topics: [XCTest, Swift Testing, Unit tests, Integration tests, UI tests, Test doubles, Mocks, Stubs, Fakes, Async tests, Testing ViewModels, Instruments, Memory Graph, Performance tests]

  # ---------------- Stage 10 ----------------
  - id: m34
    stage: s10
    number: 34
    title: SwiftUI Fundamentals
    summary: The declarative model, views, modifiers and containers.
    prerequisites: [m27, m29]
    objectives:
      - Explain how the declarative model differs from UIKit's.
      - Compose small, reusable views.
      - Use lists, grids and lazy stacks.
    topics: [Declarative model, App, Scene, View, body, Modifiers, ViewBuilder, Result builders, Controls, List, ForEach, ScrollView, Lazy stacks, Grids, Stacks, GeometryReader, safeAreaInset, Layout priorities]
  - id: m35
    stage: s10
    number: 35
    title: Layout and Navigation in SwiftUI
    summary: Layout, styling, NavigationStack, presentation and navigation state.
    prerequisites: [m34]
    objectives:
      - Navigate by value with NavigationStack and NavigationPath.
      - Present sheets, alerts and confirmation dialogs.
      - Adapt to iPhone and iPad with NavigationSplitView.
    topics: [Layout, Padding, Alignment, Shapes, SF Symbols, NavigationStack, NavigationSplitView, NavigationPath, NavigationLink, Sheet, Full-screen cover, Alerts, Confirmation dialogs, TabView, Toolbars, Deep links, Transitions]
  - id: m36
    stage: s10
    number: 36
    title: State Management
    summary: "@State, @Binding, @Environment, Observation and the older APIs: when to use each one."
    prerequisites: [m35]
    objectives:
      - Put each piece of state in the right owner.
      - Choose between @Observable and ObservableObject based on the target iOS version.
      - Explain view identity and life cycle.
    topics: ["@State", "@Binding", "@Environment", "@EnvironmentObject", "@ObservedObject", "@StateObject", ObservableObject, "@Published", "@Observable", "@Bindable", Observation, Data flow, Identity, Invalidation, Derived state]
  - id: m37
    stage: s10
    number: 37
    title: Architecture and Data in SwiftUI
    summary: Services, repositories, loading states and SwiftData in SwiftUI apps.
    prerequisites: [m36, m33]
    objectives:
      - Separate UI from logic without unnecessary abstractions.
      - Handle loading, error, empty, refresh and pagination.
      - Persist with SwiftData.
    topics: [MVVM in SwiftUI, When you don't need a ViewModel, Services, Repositories, Dependency Injection, task, refreshable, Loading states, Pagination, SwiftData, Offline-first]
  - id: m38
    stage: s10
    number: 38
    title: Interaction and User Experience in SwiftUI
    summary: Animations, gestures, forms, focus, accessibility and localization.
    prerequisites: [m37]
    objectives:
      - Animate with purpose and respect Reduce Motion.
      - Build forms with validation and FocusState.
      - Check VoiceOver and Dynamic Type.
    topics: [Gestures, Animations, Transitions, matchedGeometryEffect, Haptics, FocusState, Forms, Validation, VoiceOver, Dynamic Type, Localization, Empty and error states]
  - id: m39
    stage: s10
    number: 39
    title: Advanced SwiftUI
    summary: Custom layout, preferences, identity control and performance.
    prerequisites: [m38]
    objectives:
      - Write a custom Layout.
      - Use PreferenceKey and ViewThatFits.
      - Diagnose excessive updates with Instruments.
    topics: [Custom Layout, PreferenceKey, Anchor preferences, ViewThatFits, AnyLayout, ScrollPosition, containerRelativeFrame, Identity, Performance, Instruments, Snapshot testing]

  # ---------------- Stage 11 ----------------
  - id: m40
    stage: s11
    number: 40
    title: UIKit and SwiftUI Interoperability
    summary: UIHostingController, representables and coordinators in hybrid apps.
    prerequisites: [m39]
    objectives:
      - Add SwiftUI to an existing UIKit app.
      - Wrap UIKit views and view controllers with representables.
      - Manage hybrid life cycles.
    topics: [UIHostingController, UIViewRepresentable, UIViewControllerRepresentable, Representable coordinators, Hybrid life cycles, Incremental migration]

  # ---------------- Stage 12 ----------------
  - id: m41
    stage: s12
    number: 41
    title: Production Quality and Distribution
    summary: CI/CD, signing, versioning, crash reporting, TestFlight and App Store Connect.
    prerequisites: [m33]
    objectives:
      - Automate builds and tests with GitHub Actions.
      - Manage certificates, versions and releases.
      - Prepare an app for App Store review.
    topics: [Code review, CI/CD, GitHub Actions, Build automation, Certificates, Code signing, Versioning, Crash reporting, Logging, Telemetry, Release management, TestFlight, App Store Connect, Review Guidelines, Incident response]
  - id: m42
    stage: s12
    number: 42
    title: Secure iOS Development
    summary: Mobile application security through the lens of OWASP MASVS and MASTG, with the rigor banking and fintech demand.
    prerequisites: [m31]
    objectives:
