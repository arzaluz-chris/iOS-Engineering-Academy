# Registry of external resources. No videos.
# status: verified (with a date) only after the link has been checked with `npm run check-links`
# or by hand. developer.apple.com/documentation links are checked against their JSON data.

resources:
  - id: swift-book
    title: The Swift Programming Language
    source: Swift.org
    url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/
    kind: official
    topic: Swift language
    why: The official language reference. Each chapter of the Swift course points to the matching section.
    status: verified
    verifiedAt: 2026-11-03
  - id: swift-book-basics
    title: The Basics (The Swift Programming Language)
    source: Swift.org
    url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/thebasics/
    kind: official
    topic: Constants, variables, types and interpolation
    why: Covers let, var, type annotations, comments and print precisely. That's what your first programs are made of.
    status: verified
    verifiedAt: 2026-11-03
  - id: swift-book-basic-operators
