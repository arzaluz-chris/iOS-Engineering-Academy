questions:
  - id: q-sec-store-token
    category: seguridad
    difficulty: medio
    question: ¿Dónde guardarías el token de sesión de una app bancaria y por qué no en UserDefaults?
    answer: |
      En el **Keychain**. `UserDefaults` se guarda como un archivo plist dentro del contenedor de la app, sin cifrado propio más allá de la protección general del sistema de archivos, se incluye en respaldos y es trivial de leer en un dispositivo con jailbreak o en un respaldo sin cifrar.

      El Keychain almacena secretos cifrados por el sistema y permite elegir **cuándo** son accesibles con `kSecAttrAccessible`:
      - `kSecAttrAccessibleWhenUnlockedThisDeviceOnly`: solo con el dispositivo desbloqueado y nunca se migra a otro dispositivo por respaldo. Es una buena opción para un token bancario.
      - Las variantes `…ThisDeviceOnly` evitan que el secreto viaje en respaldos o migraciones.
      - Con `SecAccessControl` y `.biometryCurrentSet` se puede exigir Face ID o Touch ID para leer el elemento, y se invalida si cambian las huellas o rostros registrados.

      Además: guardar tokens de vida corta, renovarlos con un refresh token también en Keychain, borrar todo al cerrar sesión y nunca escribir tokens en logs.
    keyPoints:
      - Keychain y no UserDefaults, con la razón concreta.
      - Clase de accesibilidad adecuada y el sufijo ThisDeviceOnly.
      - Control de acceso biométrico con invalidación al cambiar la biometría.
      - Tokens de vida corta, limpieza al cerrar sesión y no registrarlos en logs.
    followUps:
      - question: ¿Proteger el token con Face ID hace segura la autorización de una transferencia?
        answer: No por sí solo. La biometría local demuestra que quien tiene el teléfono lo desbloqueó; un dispositivo comprometido puede saltarse checks en la app. Para operaciones de alto riesgo, la verificación debe ser criptográfica y validada por el backend, por ejemplo con una llave en el Secure Enclave que firma un desafío del servidor y solo se usa tras la biometría.
      - question: ¿El Keychain se borra al desinstalar la app?
        answer: Históricamente los elementos del Keychain han podido sobrevivir a la desinstalación. Por eso muchas apps detectan la primera ejecución tras instalar (con una marca en UserDefaults, que sí se borra) y limpian el Keychain. No conviene depender de ningún comportamiento sin verificarlo en la versión de iOS objetivo.
    related: [m42, m31]

  - id: q-sec-pinning
    category: seguridad
    difficulty: dificil
    question: ¿Qué es el certificate pinning, qué protege y qué riesgos operativos tiene?
    answer: |
      Por defecto, TLS confía en cualquier certificado firmado por una autoridad incluida en el almacén de confianza del dispositivo. El **pinning** restringe esa confianza: la app solo acepta la conexión si el certificado del servidor, o mejor su **llave pública**, coincide con uno esperado.

      **Protege** contra ataques de intermediario con certificados emitidos por una autoridad comprometida o con un certificado raíz instalado en el dispositivo (por ejemplo, un perfil de configuración malicioso o un proxy corporativo).

      **No protege** contra un dispositivo con jailbreak en manos del atacante: puede desactivar el pinning en ejecución con herramientas de instrumentación.

      **Riesgos operativos:**
      - Si el certificado o la llave rotan y la app no tiene el nuevo pin, todas las versiones instaladas dejan de conectarse. Es un incidente de disponibilidad.
      - Mitigaciones: fijar la llave pública (sobrevive renovaciones si se conserva la llave), incluir un pin de respaldo, coordinar rotaciones con el equipo de infraestructura y tener un plan de actualización forzada.

      En iOS se puede implementar en `urlSession(_:didReceive:completionHandler:)` evaluando el `SecTrust`, o declarativamente con `NSPinnedDomains` dentro de `NSAppTransportSecurity` en Info.plist (disponible desde iOS 14).
    keyPoints:
      - Qué cambia respecto a la validación TLS normal.
      - Contra qué protege y contra qué no.
      - Pinning de llave pública frente a certificado.
      - Riesgo de dejar sin servicio a la app al rotar, y pines de respaldo.
      - Formas de implementarlo en iOS.
    followUps:
      - question: ¿Qué es App Transport Security?
        answer: "Una política de iOS que, por defecto, exige HTTPS con TLS moderno para las conexiones hechas con URLSession. Las excepciones se declaran en `NSAppTransportSecurity` del Info.plist y Apple pide justificarlas en la revisión. En una app bancaria no debería haber excepciones para dominios propios."
    related: [m42, m30]

  - id: q-sec-client-trust
    category: seguridad
    difficulty: medio
    question: Un auditor reporta que la app valida en el cliente el límite diario de transferencias. ¿Qué responde un iOS Engineer?
    answer: |
      Que el hallazgo es correcto si **solo** se valida en el cliente. El dispositivo no es un entorno confiable: con un dispositivo modificado, un proxy o la propia API sin la app, se puede omitir cualquier validación local.

      La corrección es que el **backend** aplique el límite como regla de negocio autoritativa. La validación en la app se conserva solo como experiencia de usuario: avisar antes de enviar. Además conviene revisar:
      - Que la API no confíe en campos que envía el cliente para decidir permisos (por ejemplo, un `role` en el cuerpo).
      - Que los errores del backend se muestren correctamente en la app.
      - Que el caso quede cubierto por pruebas del backend.

      Este principio corresponde al control de MASVS de no depender del cliente para decisiones de seguridad.
    keyPoints:
      - El cliente no es confiable.
      - La regla autoritativa vive en el backend.
      - La validación local queda como experiencia de usuario.
      - Revisar otros datos que la API confía del cliente.
    related: [m42, m01-l03]
