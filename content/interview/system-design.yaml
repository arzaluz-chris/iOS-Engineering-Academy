  - id: q-sd-analytics
    category: system-design
    difficulty: medium
    question: Design the client side of an analytics pipeline. Events must not be lost, and the app must stay fast.
    answer: |
      **Requirements:** record events from anywhere in the app cheaply, deliver them reliably even across crashes and offline periods, respect user consent, and not hurt battery or performance.

      **Components:**
      - **Typed events:** an enum or structs (`.checkoutStarted(cartValue:)`) instead of free-form strings, so names and properties stay consistent. A schema shared with the data team.
      - **`track()` is fire-and-forget** and cheap: it stamps the event with an id (UUID), timestamp, session id and app version, and hands it to a background queue or actor.
      - **Persistent queue:** events are appended to disk (a small SQLite table or an append-only file) before anything else, so a crash or kill doesn't lose them.
      - **Batching:** flush when the batch reaches N events, every M seconds, and when the app goes to the background. One request with 50 events is much cheaper for battery and radio than 50 requests.
      - **Delivery:** on success, delete the batch; on failure, keep it and retry with backoff. The server **dedupes by event id**, so retries can't double-count.
      - **Limits:** cap the queue size and drop the oldest low-priority events if the device is offline for weeks.

      **Privacy:** check consent before recording; no PII in properties (or hash it); declare data collection in the privacy manifest and App Store privacy details. Tracking across other companies' apps needs App Tracking Transparency permission.

      **Measure the pipeline itself:** queue size, flush failures, and the gap between event time and arrival time.
    keyPoints:
      - Typed events with a shared schema.
      - Cheap track call, persisted queue, batching.
      - Flush triggers including going to the background.
      - Retries with server-side dedupe by event id.
      - Consent, PII and privacy declarations.
    followUps:
      - question: Why put an event id on each event if you already have timestamps?
        answer: |
          Retries mean the same batch can arrive twice: the request succeeded but the response was lost. With a unique id per event, the server can drop duplicates. Timestamps don't work for that because two real events can share one.
    writesCode: false
    related: [m48]

  - id: q-sd-startup-budget
    category: system-design
    difficulty: hard
    question: Launch time has crept up release after release. How do you bring it down and keep it down?
    answer: |
      **Measure first, with real-world data:**
      - The Xcode Organizer's **Launch Time** pane shows field data from users' devices (time from tap to first frame), with typical (50th percentile) and long (90th percentile) values per release. The **Launches** pane lists the functions that take the most launch time.
      - **MetricKit** gives daily launch and resume histograms to send to your own backend.
      - Locally, the Instruments **App Launch** template, on a real device, testing both warm and cold launches.

      **Common causes and fixes:**
      - **Work before the first frame:** SDK initialization, database migrations, config fetches, reading large files in the app delegate. Move it after the first frame, make it lazy, or move it off the main thread. Ask for each SDK: does this have to start before the user sees anything?
      - **Too many dynamic frameworks:** each one adds loading and linking work. Link static libraries, or use mergeable libraries (Xcode 15+).
      - **Static initializers and Objective-C `+load`** run before `main`.
      - **A heavy first screen:** show a lightweight shell with cached content, then load the rest.
      - **Synchronous network calls** at launch. Never.

      **Keep it down:**
      - A **budget** per release, for example the 90th percentile launch time can't regress more than a set amount.
      - An automated launch test in CI (`XCTApplicationLaunchMetric` in a performance test) on a fixed device, to catch regressions before release.
      - A review rule: new launch-path work needs a reason.

      App size goes in the same budget conversation: it affects download conversion and update times. Check the App Thinning Size Report, compress or remove assets, and audit large dependencies.

      On iOS, the watchdog kills an app that takes too long to launch, so a slow launch can also become a crash.
    keyPoints:
      - Field data from the Organizer and MetricKit, plus Instruments locally.
      - Defers work until after the first frame.
      - Dynamic frameworks, static initializers and the first screen as causes.
      - A budget with automated regression tests in CI.
      - Connects app size and mentions the watchdog.
    followUps:
      - question: Why test on a real device instead of the Simulator?
        answer: |
          The Simulator runs on the Mac's CPU, memory and storage, so its timings don't reflect a phone, especially an older one. Launch work is sensitive to disk and memory, so I'd profile on the oldest supported device I can get.
