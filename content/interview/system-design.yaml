  - id: q-sd-video-downloads
    category: system-design
    difficulty: hard
    question: Design offline downloads for a video streaming app. Users can start, pause, resume, cancel and delete downloads, and the content is DRM-protected.
    answer: |
      **Clarify:** on-demand titles only (HLS live streams can't be saved), FairPlay-protected, a quality choice, audio and subtitle languages, a per-account download limit and license rules like "expires 30 days after download". I'll assume all of those.

      **Components:**
      - `DownloadManager` owns one `AVAssetDownloadURLSession` (iOS 9) created with a **background** `URLSessionConfiguration` and a fixed identifier.
      - `DownloadStore`, a local database: title id, state, saved location, expiry, size.
      - `KeyManager` wraps an `AVContentKeySession` (iOS 10.3) for FairPlay.

      **Starting:** build an `AVAssetDownloadConfiguration(asset:title:)` (iOS 15), set `variantQualifiers` on its `primaryContentConfiguration` to pick a bitrate, add `auxiliaryContentConfigurations` for extra languages, and call `makeAssetDownloadTask(downloadConfiguration:)` (iOS 15). That's the current API: the iOS 27 SDK deprecates `AVAggregateAssetDownloadTask` and the older task factory methods in its favor. Save the location from `urlSession(_:assetDownloadTask:willDownloadTo:)` (iOS 18), which replaces the deprecated `didFinishDownloadingTo`, and show progress from the task's `progress` (the time-range callbacks are deprecated in iOS 27).

      **Keys:** add the asset as a content key recipient. In the key request callback call `respondByRequestingPersistableContentKeyRequest()` (throwing version, iOS 11.2), send the request data to the key server, turn the reply into a key with `persistableContentKey(fromKeyVendorResponse:options:)`, and write it to a file with Data Protection. Offline playback answers key requests from that file with `AVContentKeyResponse(fairPlayStreamingKeyResponseData:)`. The expiry lives in the key the server issued.

      **Pause and resume** are `suspend()` and `resume()`. **Cancel** is `cancel()` plus deleting partial data. **Delete** removes the files and calls `invalidatePersistableContentKey(_:options:completionHandler:)` (iOS 12.2), whose proof the server uses to free a slot in the download limit.

      **Background:** downloads run out of process. If the system terminates the app, it relaunches it with `application(_:handleEventsForBackgroundURLSession:completionHandler:)`; recreate the session with the same identifier. A **force-quit cancels every download** and the app isn't relaunched, so on launch I reconcile the store against `getAllTasks` and offer "Resume".

      **Storage:** check `volumeAvailableCapacityForImportantUsage` before starting, set eviction policies with `AVAssetDownloadStorageManager` (`.important`, `expirationDate`), and on launch drop records whose asset is gone (`assetCache?.isPlayableOffline`).

      **Analytics:** started, completed, failed (with error domain and code), time to complete, bytes, offline plays and key failures, queued locally until online.
    keyPoints:
      - Background AVAssetDownloadURLSession; the force-quit behavior and reconciling on launch.
      - "AVAssetDownloadConfiguration with makeAssetDownloadTask(downloadConfiguration:) (iOS 15) as the current API, knowing the aggregate task is deprecated in iOS 27."
      - FairPlay persistable keys through AVContentKeySession, stored and used offline.
      - Pause, resume, cancel and delete map to task and file operations, plus key invalidation.
      - Storage checks, eviction policy, and expiry enforced by the key.
      - Progress from task.progress and download analytics.
    followUps:
      - question: Should downloads start over cellular?
        answer: Make it a user setting, defaulting to Wi-Fi only for video. Set `allowsExpensiveNetworkAccess` (iOS 13) or `allowsCellularAccess` on the background configuration from that setting. For automatic downloads, like the next episode, use a discretionary session so the system waits for good conditions; Apple's docs note non-discretionary asset downloads can only start while the app is in the foreground.
      - question: How do you enforce "expires 48 hours after the first play"?
        answer: On the key server, not in the app. The persistable key carries the rental rules, and the app can't extend them. The app also stores the expiry it got from the API so it can show "expires in 2 days" and clean up expired titles, but that's display, not enforcement.
      - question: Where do the files live, and how do you find them again?
        answer: The system picks the location and reports it in `willDownloadTo`. I'd persist it as bookmark data or a path relative to the app's home directory rather than an absolute path, then rebuild the `AVURLAsset` from it for playback and deletion.
    writesCode: false
