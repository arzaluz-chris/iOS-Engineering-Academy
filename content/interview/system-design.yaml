  - id: q-sd-chat
    category: system-design
    difficulty: hard
    question: Design a one-to-one and group chat feature for an iOS app.
    answer: |
      **Requirements:** send and receive text and images in real time, message history, delivery and read status, works with a flaky connection, notifications when the app isn't running. Out of scope unless asked: end-to-end encryption and calls.

      **Transport:** a persistent connection while the app is in the foreground, a **WebSocket** (`URLSessionWebSocketTask`), for receiving messages in real time. Sending can go over the socket or a plain HTTPS POST. In the background the socket is gone, so **push notifications** carry new messages, and the app syncs when it comes back.

      **Message model:** each message has a **client-generated id** (a UUID) and, once the server accepts it, a **server sequence number** per conversation. The client id makes sends idempotent: if a retry reaches the server twice, it's stored once. The sequence number gives one order for everyone, independent of device clocks.

      **Sending (outbox):** write the message locally as `pending` and show it immediately, then send. On acknowledgment, store the sequence number and mark it `sent`. On failure, retry with backoff; after a while, show "not delivered, tap to retry". The outbox survives app restarts.

      **Sync:** for each conversation, remember the last sequence number seen. After reconnecting, ask for everything after it. Gaps in sequence numbers tell you something was missed.

      **Persistence:** a local database with conversations and messages, indexed by conversation and sequence; the UI reads from it, so everything works offline. Images upload separately and the message references the uploaded URL.

      **Failure modes:** socket drops (reconnect with backoff, then sync), duplicates (dedupe by client id), out-of-order delivery (sort by sequence), and the user sending while offline (outbox).

      **Measure:** send-to-delivered latency, failed sends, reconnect rate, time to show a conversation.
    keyPoints:
      - WebSocket in the foreground, push plus sync in the background.
      - Client-generated ids for idempotency, server sequence numbers for ordering.
      - A persistent outbox with optimistic UI and retry.
      - Sync from the last seen sequence number after reconnecting.
      - Local database as the source for the UI, and named failure modes.
    followUps:
      - question: Why not order messages by their timestamps?
        answer: |
          Device clocks are wrong or skewed, and two people can send at nearly the same moment. Ordering by a sequence the server assigns gives every participant the same order. The timestamp is still shown, but it doesn't decide the order.
      - question: How do read receipts work without a flood of requests?
        answer: |
          Send one "read up to sequence N" per conversation, not one per message, and debounce it while the user scrolls. The server stores the highest value per participant.
    writesCode: false
