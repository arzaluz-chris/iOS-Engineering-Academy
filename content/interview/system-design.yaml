questions:
  - id: q-sd-feed-offline
    category: system-design
    difficulty: hard
    question: Design the transactions screen of a banking app that has to work offline and show millions of historical transactions.
    answer: |
      A structure that fits in 45 minutes:

      1. **Requirements.** Functional: list transactions by date, search, filter by account, view details. Non-functional: fast launch, offline use with recent data, protected sensitive data, accessibility.
      2. **API.** **Cursor**-based pagination (not page numbers: new transactions would shift the pages). The response has `items` and `nextCursor`. To refresh, ask for transactions newer than the most recent one I have.
      3. **Local data model.** Persistence (SwiftData or Core Data) holding the last few months of transactions, indexed by account and date. The full history isn't downloaded; it's paged in on demand.
      4. **Layers.** View → ViewModel/screen state → repository. The repository returns local data first and then refreshes from the network (*stale-while-revalidate*), exposing a stream of states (`loading`, `data(local)`, `data(refreshed)`, `error with local data`).
      5. **Offline.** Show what's stored, with the time of the last sync. No blank screens.
      6. **Security.** Local store with Data Protection `complete`, wiped on sign-out, no amounts in logs, content hidden in the app switcher.
      7. **Performance.** A lazy list, grouping by day computed off the main thread, prefetching as you near the end.
      8. **Observability.** Metrics for time to first content and the sync error rate.
    keyPoints:
      - I clarified functional and non-functional requirements first.
      - I chose cursor pagination and explained why.
      - A local-first strategy with network refresh.
      - Screen states, including offline.
      - Protection for sensitive local data.
      - List performance and observability.
    followUps:
      - question: What do you do if a local transaction was corrected on the server?
        answer: The backend should expose versions or an updated-at marker per transaction, or a changes endpoint keyed on a sync point. The client applies updates by stable identifier, and for financial data the server always wins.
      - question: How do you test this design?
        answer: I'd test the repository with a fake network client and in-memory persistence, covering the order states are emitted in, errors, and pagination. The view gets tested with fixed screen states and, if it makes sense, snapshots.
    related: [m48]

  - id: q-sd-pagination
    category: system-design
    difficulty: easy
    question: The feed API returns pages with ?page=3. What problems does that cause on mobile, and what would you ask the backend for instead?
    answer: |
      **Offset pagination** (`page` or `offset` plus `limit`) breaks when the list changes while the user scrolls. If five new posts are inserted at the top between page 1 and page 2, page 2 now starts five items earlier: the user sees duplicates. If items are deleted, some are skipped and never shown. Large offsets also get slow on many databases, because the server still has to walk past every skipped row.

      I'd ask for **cursor-based pagination**: each response includes the items and an opaque `nextCursor`, and the next request sends it back.

      ```json
      { "items": [ … ], "nextCursor": "eyJpZCI6IDk4NzY1fQ" }
      ```

      The cursor encodes a position (for example "after post 98765, sorted by creation time"), so inserts at the top don't shift what comes next. When `nextCursor` is null, the list is complete. For pull-to-refresh, I either reload from the start or ask for items newer than the first one I have.

      On the client: dedupe by stable id anyway, as a safety net; start loading the next page a few rows before the end; never fire two requests for the same cursor; and keep a separate "loading more failed, tap to retry" state at the bottom instead of replacing the whole list with an error.
    keyPoints:
      - Explains duplicates and skipped items with offset pagination.
      - Cursor pagination with an opaque nextCursor.
      - How refresh and end of list work.
      - Client-side dedupe, prefetching and avoiding duplicate requests.
      - A footer error state instead of a full-screen error.
    followUps:
      - question: When is offset pagination fine?
        answer: |
          When the data doesn't change while the user browses it, or when the user needs to jump to an arbitrary page, like search results with page numbers or an admin table. For an infinite feed that updates constantly, cursors are the better fit.
    writesCode: false
    related: [m48, m30]

  - id: q-sd-image-cache
    category: system-design
    difficulty: medium
    question: Design an image loading and caching layer for an app with long scrolling lists of remote images.
    answer: |
      **Requirements:** images load fast while scrolling, aren't downloaded twice, memory stays bounded, and cells don't show the wrong image after reuse.

      **Components:**
      1. **Memory cache** of decoded images, keyed by URL plus target size. `NSCache` fits: it's thread-safe and evicts under memory pressure. I set a cost limit based on decoded byte size, since a decoded image is width × height × 4 bytes, not the file size.
      2. **Disk cache** of the downloaded data in the Caches directory, with a size limit and LRU eviction. `URLCache` can cover this if the server sends good cache headers; otherwise a custom store.
      3. **Loader** that coalesces requests: if ten cells ask for the same URL at once, one download happens.

      ```swift
      actor ImageLoader {
          private var cache: [URL: Data] = [:]
          private var inFlight: [URL: Task<Data, Error>] = [:]
          private let fetch: @Sendable (URL) async throws -> Data

          init(fetch: @escaping @Sendable (URL) async throws -> Data) { self.fetch = fetch }

          func data(for url: URL) async throws -> Data {
              if let cached = cache[url] { return cached }
              if let running = inFlight[url] { return try await running.value }

              let task = Task { try await fetch(url) }
              inFlight[url] = task
              defer { inFlight[url] = nil }

              let data = try await task.value
              cache[url] = data
              return data
          }
      }
      ```

      (The dictionary stands in for the real memory cache here.) The in-flight entry is stored **before** the first `await`, so the actor's reentrancy can't start a second download.

      4. **Decoding and downsampling** off the main thread to the size actually displayed. Decoding a 4000-pixel photo for a 100-point thumbnail is the classic memory spike.
      5. **Cell reuse:** cancel the load when the cell is reused (or let SwiftUI's `.task` cancel it), and check the cell still wants that URL before setting the image.

      **What I'd measure:** cache hit rate, memory peak while scrolling, dropped frames, and bytes downloaded per session.
    keyPoints:
      - Memory and disk tiers with bounded size and eviction.
      - Coalesces duplicate in-flight requests.
      - Downsamples and decodes off the main thread.
      - Handles cell reuse and cancellation.
      - Measures hit rate, memory and scrolling performance.
    followUps:
      - question: Why might the deduplication fail if you registered the task after awaiting something?
        answer: |
          Actors are reentrant. If the method awaited anything before writing `inFlight[url]`, a second call could run during that suspension, find no entry, and start its own download. Checking and inserting without a suspension point in between is what makes it safe.
      - question: Would you use a third-party library instead?
        answer: |
          In many apps, yes: Kingfisher or Nuke solve this well. I'd still want to understand the design so I can configure the limits and debug memory issues. Building it myself makes sense when I need tight control or can't take the dependency.
    writesCode: true
    related: [m48, m29, m43]

  - id: q-sd-networking-layer
    category: system-design
    difficulty: medium
    question: Design the networking layer for a mid-sized app with about 40 endpoints.
    answer: |
      **Goals:** endpoints are cheap to add, auth and errors are handled in one place, and everything is testable without a server.

      **Pieces:**
      - **Endpoint description:** a value that knows its path, method, query, body and response type, for example `Endpoint<User>`. Adding an endpoint means adding one of these, not a new method with copied `URLSession` code.
      - **API client:** one type that turns an endpoint into a `URLRequest`, sends it with an injected `URLSession`, checks the status code, and decodes. It exposes `async throws` methods.
      - **Interceptors or middleware:** add the auth header, a request id, the app version, and log (without secrets).
      - **Auth refresh:** on a 401, refresh the token once and retry. Concurrent requests that hit 401 at the same time must share **one** refresh. An actor holding the in-flight refresh task does that cleanly. If the refresh fails, sign the user out.
      - **Typed errors:** map transport errors, HTTP status and decoding failures to an app error the UI can act on: offline, unauthorized, server error, invalid data.
      - **Retries:** only for idempotent requests (GET, or POST with an idempotency key), only for transient failures (timeouts, 503), with exponential backoff and jitter, and a cap.

      **Testing:** stub the endpoint protocol above the client, and use a `URLProtocol` stub to test the client itself.

      **Tradeoffs:** I wouldn't build a big generic framework on day one. A thin client plus endpoint values covers most apps. If the backend has an OpenAPI spec, generating the client (for example with Apple's swift-openapi-generator) removes a whole class of mismatches.
    keyPoints:
      - Endpoints as values, one client for transport.
      - Central auth with a single shared token refresh.
      - Typed errors the UI can act on.
      - Retries only for idempotent and transient failures, with backoff and jitter.
      - Testability with protocols and URLProtocol.
    followUps:
      - question: What does "exponential backoff with jitter" mean, and why the jitter?
        answer: |
          Wait longer after each failed attempt (0.5 s, 1 s, 2 s, 4 s… up to a cap), and pick a random delay up to that value instead of the exact value. Without jitter, thousands of clients that failed at the same moment, say during an outage, all retry at the same moments and hit the recovering server in waves.
    writesCode: false
