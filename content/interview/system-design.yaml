  - id: q-sd-push-flow
    category: system-design
    difficulty: medium
    question: Walk me through how a push notification gets from your backend to the user's screen, and what you'd design around it.
    answer: |
      **Registration:**
      1. The app asks for permission with `UNUserNotificationCenter.requestAuthorization(options:)` (alerts, sounds, badges).
      2. It calls `registerForRemoteNotifications()`. APNs returns a **device token** through `application(_:didRegisterForRemoteNotificationsWithDeviceToken:)`.
      3. The app sends the token to the backend, tied to the signed-in user and the device. The token can change (after a restore or a reinstall, for example), so the app registers on every launch and sends the current token. Apple's docs say not to cache it locally.

      **Sending:** the backend sends an HTTP/2 request to APNs with the token, a JSON payload with an `aps` dictionary, and headers like `apns-push-type`. APNs delivers it to the device; if the device is offline, APNs can hold it and retry until the expiration the backend set with `apns-expiration`.

      **On the device:**
      - **Alert notifications** are shown by the system. When the user taps one, `userNotificationCenter(_:didReceive:withCompletionHandler:)` is called, and the app routes to the right screen (I reuse the deep link router).
      - **Notification Service Extension:** with `"mutable-content": 1`, the extension can change the content before display, for example to download an image or decrypt the text. It has about 30 seconds.
      - **Background notifications** (`content-available: 1`, push type `background`, priority 5) wake the app to refresh data. They're low priority, can be throttled, and aren't guaranteed. Apple says not to send more than two or three per hour.

      **Design around it:** never put sensitive data in the payload in plain text; send an id and fetch the details (or encrypt and decrypt in the extension). Unregister the token on sign-out. Don't rely on background pushes for correctness: sync when the app opens anyway.
    keyPoints:
      - Permission, registration, device token sent to the backend.
      - Knows the token can change and handles sign-out.
      - Backend to APNs to device, with the aps payload.
      - Service extension for rich or encrypted content.
      - Background pushes are throttled and not guaranteed.
    followUps:
      - question: How would you handle a notification tap when the app was not running?
        answer: |
          The app launches and the notification center delegate still receives the response, so I set the delegate early in launch. The handler passes the payload to the same router used for deep links, which waits until the UI and the session are ready (for example after unlocking with biometrics) before navigating.
    writesCode: false
