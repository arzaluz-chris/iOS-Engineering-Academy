  - id: q-sd-deep-linking
    category: system-design
    difficulty: easy
    question: How would you add deep links so that https://example.com/orders/123 opens the order in the app?
    answer: |
      Use a **universal link**, not a custom URL scheme.

      **Setup:**
      - Add the Associated Domains capability with `applinks:example.com`.
      - Host an `apple-app-site-association` JSON file at `https://example.com/.well-known/apple-app-site-association`, served over HTTPS with a valid certificate and **no redirects**, listing the app id and the paths the app handles (`/orders/*`).
      - Since iOS 14, devices fetch that file through an Apple-managed CDN, not from your server directly, so changes take time to propagate.

      **Handling in the app:**
      - SwiftUI: `.onOpenURL { url in … }` receives universal links and custom-scheme URLs.
      - UIKit with scenes: a universal link arrives as an `NSUserActivity` of type `NSUserActivityTypeBrowsingWeb`, in `scene(_:continue:)` when the app is running, or in the connection options of `scene(_:willConnectTo:options:)` on a cold launch. That second case is easy to forget.

      **Routing:** parse the URL into a typed route (`.order(id: "123")`) in one place, and let a router or coordinator navigate. The same route type serves push notification taps and Spotlight. If the user isn't signed in, keep the pending route and apply it after sign-in.

      **Why not a custom scheme like `myapp://`:** any app can register the same scheme, there's no fallback when the app isn't installed, and the link isn't a normal web URL you can share. Universal links fall back to the website.
    keyPoints:
      - Universal links over custom schemes, with the reasons.
      - Associated Domains entitlement and the AASA file requirements.
      - Handling for both running and cold launch cases.
      - Parsing into a typed route with central navigation.
      - Pending routes when the user must sign in first.
    followUps:
      - question: Should the app trust the parameters in a deep link?
        answer: |
          No. A link is input from outside: anyone can craft one. Validate ids, never let a link perform a sensitive action directly (like confirming a payment), and still check authorization on the server when loading the order.
    writesCode: false
