  - id: q-sd-news-feed
    category: system-design
    difficulty: medium
    question: Design the home feed of a social app, like a news feed with posts, images and likes.
    answer: |
      **Clarify first:** is the feed ranked or chronological? Does it need to work offline? Are likes and comment counts live? Expected scale of posts per session? I'll assume a ranked feed computed by the server, offline reading of the last session, and counts that can be a little stale.

      **API:** `GET /feed?cursor=…` returns posts and a `nextCursor`. The server ranks; the client never re-sorts. Each post has a stable id, author, text, image URLs with sizes, and counts.

      **Client components:**
      - `FeedRepository`: fetches pages, writes them to a local store, exposes a stream of feed states.
      - Local store: the last N posts (say a few hundred) in SwiftData, Core Data or SQLite, enough to show something instantly at launch and offline.
      - Image pipeline with memory and disk caches and downsampling.
      - The view: a lazy list (`UICollectionView` with a diffable data source, or `List`/`LazyVStack`), prefetching the next page near the end and images for upcoming rows.

      **Data flow at launch:** show the cached feed immediately, fetch the first page in the background, then replace it. Insert new posts with a "new posts" pill instead of jumping the scroll position under the user's finger.

      **Likes:** optimistic update. Change the UI immediately, send the request, and roll back with a message if it fails. Retry safely with an idempotent endpoint (`PUT /posts/{id}/like`).

      **Failure modes:** no network (cached feed and a banner), a failed next page (retry footer), a deleted post (handle 404 on detail).

      **Measure:** time to first post, scroll hitches, page load errors, images downloaded per session.
    keyPoints:
      - Asks clarifying questions about ranking, offline and freshness.
      - Cursor pagination with server-side ranking.
      - Cache-first launch and a non-disruptive way to insert new content.
      - Optimistic likes with rollback and idempotent requests.
      - Failure states and metrics.
    followUps:
      - question: How would you keep the like count fresh without polling every post?
        answer: |
          Refresh counts when posts come back on screen or on pull-to-refresh, and accept a little staleness. If the product really needs live counts, a WebSocket or server-sent events channel for visible post ids, but that's real cost on the backend for a small gain.
    writesCode: false
