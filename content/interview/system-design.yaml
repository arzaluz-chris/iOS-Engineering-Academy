  - id: q-sd-feature-flags
    category: system-design
    difficulty: medium
    question: Design a feature flag system for the iOS app.
    answer: |
      **Uses:** turn features on gradually (1%, 10%, 100%), run A/B tests, ship code dark and enable it later, and have **kill switches** to disable a broken feature without an App Store release.

      **Client design:**
      - A `FeatureFlags` type with **typed accessors** (`flags.isNewCheckoutEnabled`), not string lookups scattered through the code.
      - **Defaults compiled into the app** for every flag, so a fresh install with no network behaves sensibly.
      - Fetch the remote config at launch and on foreground, and **persist the last known values** to disk.
      - **Read values at a stable point**, typically at launch or the start of a session, and keep them for the session. A flag that flips while the user is in the middle of checkout produces weird half-states.
      - Targeting (country, app version, user cohort) happens on the server, which returns already-evaluated values for this user. That keeps the rules out of the app and lets you change them without a release.

      **Safety:**
      - Flags never grant security: the server must enforce anything a flag hides, because a modified client can turn any flag on.
      - A kill switch has to fail toward "off" if it can't be fetched, or it's useless when you need it.

      **Lifecycle:** every flag has an owner and an expiry. Once a feature is at 100% and stable, remove the flag and the old code path. Old flags pile up into untested combinations.

      **Testing:** inject `FeatureFlags` so tests can set any combination, and test both paths of each live flag.
    keyPoints:
      - Rollouts, experiments and kill switches as use cases.
      - Typed access, compiled defaults and cached remote values.
      - Stable values within a session.
      - Server-side targeting and server-side enforcement.
      - Flag cleanup and testing both paths.
    followUps:
      - question: Build it or buy it?
        answer: |
          For most teams, use an existing service (Firebase Remote Config, LaunchDarkly or similar) behind my own `FeatureFlags` protocol so I can swap it. Building makes sense if there are strict data rules, like a bank that can't send user attributes to a third party.
    writesCode: false
