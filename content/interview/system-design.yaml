  - id: q-sd-photo-upload
    category: system-design
    difficulty: hard
    question: Users upload batches of high-resolution photos, often on bad connections. Design the upload flow.
    answer: |
      **Requirements:** uploads continue if the user leaves the app, survive bad networks, show progress, don't duplicate photos, and don't burn through cellular data unexpectedly.

      **Flow:**
      1. **Prepare locally.** When the user picks photos, export each one to a file in the app container: resized or recompressed if the product allows it, with location metadata stripped if it's not needed. Create a record in a local upload queue (`pending`, with a client-generated id).
      2. **Get an upload target.** Ask the backend for a pre-signed URL per photo (to object storage), sending the client id. The server is idempotent on that id, so retries don't create duplicates.
      3. **Upload with a background session.** `URLSessionConfiguration.background(withIdentifier:)` hands the transfers to a system process, so they continue while the app is suspended. Background sessions only support **upload tasks from a file**, which is why step 1 writes files. Use one session and start many tasks, rather than one session per photo.
      4. **Finish.** When a task completes, the app is woken (relaunched if it was terminated by the system), recreates the session with the same identifier, and receives the delegate callbacks. It then tells the backend the upload is complete and marks the record done.

      **Resuming:** since iOS 17, URLSession upload tasks can resume after interruption if the server supports the resumable upload protocol draft Apple described at WWDC23. Without that, large files need chunking on the API side.

      **Failure modes:** if the user force-quits from the app switcher, the system **cancels** background transfers and doesn't relaunch the app, so the queue must restart pending items on next launch. Expired pre-signed URLs need a fresh one. Low storage: clean up exported files after success.

      **Settings and UX:** a "cellular uploads" toggle (`allowsCellularAccess`), per-photo progress, and a clear failed state with retry.
    keyPoints:
      - Exports to files first because background sessions require file uploads.
      - A persistent local queue with client ids for idempotency.
      - Background URLSession behavior, including relaunch and reconnecting by identifier.
      - Knows force-quit cancels background transfers.
      - Pre-signed URLs, resumable uploads, cellular settings and progress.
    followUps:
      - question: Why upload directly to object storage with a pre-signed URL instead of to your API server?
        answer: |
          The API servers don't have to proxy large binary bodies, and object storage is built for exactly that load. The API only issues short-lived, scoped URLs and records the result, so it stays in control of who can upload what.
    writesCode: false
    related: [m48, m30]

  - id: q-sd-offline-notes
    category: system-design
    difficulty: hard
    question: Design an offline-first notes app that syncs across a user's devices.
    answer: |
      **Clarify:** single user on several devices, or shared notes with collaborators? Plain text or rich text? How likely are simultaneous edits? I'll assume one user, several devices, rich text, conflicts rare but possible.

      **Principle:** the **local database is the source of truth for the UI**. Every edit writes locally first and the app never waits for the network to show or save anything. Sync runs in the background.

      **Local model:** notes with a client-generated id, content, `updatedAt`, a `version` from the server, and a `dirty` flag (or a separate change log of pending operations). Deletions are **tombstones** (`deletedAt`), not row removals, so the deletion can be synced.

      **Sync protocol:**
      - **Push:** send pending changes, each with the base version it was edited from.
      - **Pull:** ask for everything changed since my last sync token; the server returns changes and a new token.
      - The server rejects a push whose base version is stale. That's a conflict.

      **Conflict resolution**, from simplest to most complex:
      1. **Last writer wins** per note. Simple, but silently loses an edit.
      2. **Field-level merge:** title and body resolved separately.
      3. **Keep both:** save the losing version as a "conflicted copy", like many file sync tools do. Honest and simple for notes.
      4. **CRDTs or operational transforms** for real-time collaborative text. Correct, but a large investment.

      For this app I'd pick field-level merge plus a conflicted copy when the body changed on both sides.

      **Triggers:** sync at launch, on foreground, after edits (debounced), on reconnect (`NWPathMonitor`), and with background refresh. Retry with backoff.

      **Alternative:** if it's Apple-only, CloudKit (or SwiftData with CloudKit sync) gives you much of this, with fewer conflict controls.

      **Measure:** sync failures, conflict rate, time from edit to available on another device.
    keyPoints:
      - Local-first writes; the UI never waits for the network.
      - Client ids, versions, dirty tracking and tombstones.
      - A push and pull protocol with sync tokens.
      - Compares conflict strategies and picks one with a reason.
      - Sync triggers, CloudKit as an alternative, and metrics.
    followUps:
      - question: Why tombstones instead of deleting the row?
        answer: |
          If you delete the row, the next sync can't tell "deleted here" from "never existed here", and another device may push the note back. A tombstone syncs the deletion explicitly. You purge tombstones once every device has synced past them.
    writesCode: false
