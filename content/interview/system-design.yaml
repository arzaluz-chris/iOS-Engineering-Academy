  - id: q-sd-approach
    category: system-design
    difficulty: easy
    question: How do you approach an iOS system design interview? Walk me through how you'd use the 45 minutes.
    answer: |
      I run the same process every time and say out loud which step I'm on, so the interviewer can steer.

      1. **Clarify (about 5 minutes).** Who uses it and what are the three or four core actions? Then the non-functional side: offline, real time, scale (items per screen, media size), minimum iOS version, sensitive data. I write the answers down as a short list and state assumptions: "I'll assume a chronological feed and offline reading of the last session; tell me if you'd rather focus elsewhere." Then I say what's out of scope.
      2. **API and data model (5 minutes).** The endpoints the client needs, the shape of the main entities, and pagination (cursors). The backend is a black box with a contract.
      3. **Components and data flow (10–15 minutes).** A box diagram: views, view models, a repository per domain, network client, local store, background work. Then I trace the main path end to end, like "launch, show cache, fetch page one, merge, render".
      4. **Deep dive (10 minutes).** One or two hard parts, ideally the ones the interviewer cares about: sync and conflicts, caching, the upload queue.
      5. **Failure modes and quality (5–8 minutes).** No network, partial failure, retries and idempotency, app killed mid-operation, security of stored data, metrics I'd ship (time to first content, error rates), how I'd test it.
      6. **Wrap up (2 minutes).** The main tradeoffs I made and what I'd do next with more time.

      The questions in this bank like the offline banking feed, chat and photo upload all follow this shape.

      Common mistakes: drawing for ten minutes in silence, naming libraries instead of responsibilities ("Alamofire" says nothing; "a client that retries idempotent requests" does), and spending half the time on requirements. If the interviewer pushes on something, that's where the points are, so I follow them there.
    keyPoints:
      - Clarifies functional and non-functional requirements and states assumptions and scope.
      - API contract and data model before components.
      - A component diagram plus one traced data flow.
      - A deep dive on the hard part, guided by the interviewer.
      - Failure modes, offline, security, observability and testing.
      - Watches the clock and closes with tradeoffs.
    followUps:
      - question: The interviewer gives you almost no requirements and says "you decide". What do you do?
        answer: Make the decisions explicitly and quickly. Pick a reasonable scope, say why ("offline matters for a commuter app, so I'll design for it"), and move on. They want to see you make tradeoffs, not wait for a spec.
      - question: How deep should you go into the backend?
        answer: Only as far as the client depends on it. The API shape, pagination, idempotency keys, push payloads and error contracts matter because they change the client design. Database sharding and server caching usually don't, unless the interviewer asks.
