questions:
  - id: q-uikit-vc-lifecycle
    category: uikit
    difficulty: easy
    question: Walk through the lifecycle of a UIViewController and what you'd do in each method.
    answer: |
      - `loadView`: creates the root view. You only override it to assign your own view without a storyboard; don't call `super` if you're replacing the view entirely.
      - `viewDidLoad`: once, when the view is in memory. Initial setup: subviews, constraints, data sources, observing data.
      - `viewWillAppear`: every time the view is about to show. Refresh data that may have changed, adjust the navigation bar.
      - `viewIsAppearing` (iOS 17 and later, back-deployed to iOS 13): the view already has the right trait collection and geometry. A good place for work that depends on size.
      - `viewWillLayoutSubviews` / `viewDidLayoutSubviews`: on every layout pass. Adjustments that depend on final sizes; they need to be cheap.
      - `viewDidAppear`: the view is now visible. Start animations, log the screen view for analytics.
      - `viewWillDisappear` / `viewDidDisappear`: stop work, save state, cancel tasks that no longer make sense.

      `deinit` isn't part of the view lifecycle, but it's how you confirm the controller is freed when you leave the screen.
    keyPoints:
      - viewDidLoad happens once; viewWillAppear on every appearance.
      - Geometry-dependent work goes in layout or viewIsAppearing, not viewDidLoad.
      - Stop or cancel work on disappear.
      - deinit to confirm there are no leaks.
    followUps:
      - question: Why shouldn't you read view.bounds in viewDidLoad to compute layout?
        answer: Because at that point the view doesn't have its final size in the hierarchy yet; it might have the storyboard's size, or zero. Auto Layout or the layout methods are the right place.
    related: [m22]

  - id: q-uikit-cell-reuse
    category: uikit
    difficulty: medium
    question: How does cell reuse work, and what bugs does it cause?
    answer: |
      `UITableView` and `UICollectionView` only create the cells needed to fill the screen plus a small margin. As you scroll, cells that go off screen are put in a reuse queue and handed back when you call `dequeueReusableCell`. That way a list of 10,000 items uses a few dozen cells.

      Typical bugs:
      - **Leftover state:** setting a property only in some cases (for example, showing a badge if the item is new and not removing it if it isn't). Every configuration has to set all the state, or reset it in `prepareForReuse`.
      - **Images in the wrong cell:** an async download finishes after the cell is already showing a different item. You fix it by cancelling the load in `prepareForReuse`, or by checking that the item's identifier is still the same before setting the image.
      - Heavy work in `cellForRowAt`, which runs on the main thread on every scroll.
    keyPoints:
      - The cell pool and dequeue.
      - Leftover state, and prepareForReuse or full configuration.
      - Async loads that land in the wrong cell.
      - No heavy work during configuration.
    followUps:
      - question: What do diffable data sources give you over reloadData?
        answer: You describe the state you want with a **snapshot** of identifiers, and the data source works out the differences and animates insertions, deletions and moves. It avoids the model/view inconsistencies that throw exceptions with `performBatchUpdates`. It needs stable `Hashable` identifiers.
    related: [m24]
