questions:
  - id: q-mem-arc
    category: memoria
    difficulty: facil
    question: ¿Cómo funciona ARC y qué es un ciclo de retención?
    answer: |
      **ARC** (Automatic Reference Counting) lleva la cuenta de cuántas referencias **fuertes** apuntan a cada instancia de clase. El compilador inserta las operaciones de retención y liberación; cuando la cuenta llega a cero, la instancia se libera y se ejecuta su `deinit`. No es un recolector de basura: no hay pausas ni un proceso que recorra la memoria.

      Un **ciclo de retención** ocurre cuando dos o más objetos se retienen fuertemente entre sí, directa o indirectamente. Ninguna cuenta llega a cero y ninguno se libera: es una fuga de memoria.

      Ejemplos típicos: un view controller que guarda un closure que captura `self` de forma fuerte; un delegate declarado como propiedad fuerte; un timer que retiene a su target.

      Se rompen con referencias `weak` (optional, se vuelve `nil` al liberarse el objeto) o `unowned` (no optional, para cuando la referencia nunca debe sobrevivir al objeto).
    keyPoints:
      - ARC cuenta referencias fuertes y libera al llegar a cero.
      - ARC no es recolección de basura.
      - Definición de ciclo de retención con un ejemplo real de iOS.
      - weak frente a unowned.
    followUps:
      - question: ¿Cómo detectas una fuga en una app?
        answer: Con el **Memory Graph Debugger** de Xcode, que muestra instancias vivas y quién las retiene, y con Instruments (Leaks y Allocations). Un método rápido es poner un `print` o breakpoint en `deinit` y verificar que se ejecute al cerrar la pantalla.
      - question: ¿Por qué los delegates suelen declararse weak?
        answer: Porque normalmente el objeto que delega (por ejemplo, una vista) es propiedad del delegate (el view controller). Si la vista retuviera fuertemente al controller se formaría un ciclo. Para declarar `weak var delegate`, el protocolo debe estar restringido a clases (`AnyObject`).
    related: [m13]
