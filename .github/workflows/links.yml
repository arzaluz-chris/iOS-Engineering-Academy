# Revisa semanalmente los enlaces de content/resources.yaml y publica el reporte en el resumen del job.
name: Enlaces · verificación

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Comprobar enlaces
        run: npm run check-links | tee links.txt
      - name: Resumen
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat links.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
